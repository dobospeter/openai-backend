services:
  api:
    container_name: openai-api
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_ORGANIZATION=${OPENAI_ORGANIZATION}
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
    depends_on:
      - db
    networks:
      - openai-network

  db:
    image: postgres:15
    container_name: openai-postgres
    environment:
      POSTGRES_DB: openai_api
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openai_api" ]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - openai-network

    # Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: openai-nginx
    restart: unless-stopped
    ports:
      - "8765:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - openai-network

networks:
  openai-network:
    driver: bridge

#volumes:
#    sail-mysql:
#        driver: local
#    sail-redis:
#        driver: local
volumes:
  db-data:
