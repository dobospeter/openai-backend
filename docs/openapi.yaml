openapi: 3.0.3
info:
  title: OpenAI Backend API
  version: 1.0.0
  description: |
    REST API for holding conversations with an OpenAI chat model.

    A **conversation** carries the settings (model, temperature, system prompt) and a list of **messages**.
    Posting a message sends it, together with the most recent history, to OpenAI and stores both the question
    and the answer.

    ### Errors
    Every error uses one format, [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) problem details
    (`application/problem+json`). Besides the standard members each problem has a machine readable `code`;
    validation problems add `errors`, keyed by field.

    | Status | `code` examples                                              |
    |--------|--------------------------------------------------------------|
    | 400    | `bad_request`                                                |
    | 404    | `conversation_not_found`, `message_not_found`, `not_found`   |
    | 405    | `method_not_allowed`                                         |
    | 422    | `validation_failed`, `invalid_value`                         |
    | 429    | `too_many_requests`                                          |
    | 500    | `internal_error`                                             |
    | 502    | `chat_completion_failed` (OpenAI rejected or broke)          |
    | 504    | `chat_completion_timeout` (OpenAI did not answer in time)    |

    ### Pagination
    List endpoints take `page` and `per_page` and return a `meta` object with the totals.
servers:
  - url: /api
    description: This server
tags:
  - name: Conversations
  - name: Messages
  - name: Meta

paths:
  /version:
    get:
      tags: [Meta]
      operationId: getVersion
      summary: Current application version
      responses:
        '200':
          description: The version of the running application.
          content:
            application/json:
              schema:
                type: object
                required: [currentAppVersion]
                properties:
                  currentAppVersion:
                    type: string
                    example: 1.0.0

  /v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List conversations
      description: Most recently active conversations first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a conversation
      description: Every field is optional; omitted settings fall back to the server defaults.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: The conversation was created.
          headers:
            Location:
              description: URL of the new conversation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a conversation
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Conversations]
      operationId: replaceConversation
      summary: Replace a conversation's settings
      description: |
        Full replacement: `title`, `model`, `temperature` and `system_prompt` must all be sent
        (`system_prompt` may be `null` to clear it). Messages are left untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationReplace'
      responses:
        '200':
          description: The updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation
      description: Deletes the conversation together with all of its messages.
      responses:
        '204':
          description: The conversation was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List the messages of a conversation
      description: Oldest messages first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: One page of messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message and get the answer
      description: |
        Sends the message plus the most recent history to OpenAI. On success both the user message and the
        assistant's answer are stored and returned. If OpenAI fails nothing is stored, so the request can be
        retried safely. Limited to a lower request rate than the other endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '201':
          description: The exchange was stored.
          headers:
            Location:
              description: URL of the assistant message.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get a message
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Delete a message
      responses:
        '204':
          description: The message was deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

  schemas:
    Conversation:
      type: object
      required: [id, title, model, temperature, system_prompt, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          example: Trip planning
        model:
          type: string
          example: gpt-4
        temperature:
          type: number
          minimum: 0
          maximum: 2
          example: 0.7
        system_prompt:
          type: string
          nullable: true
          maxLength: 4000
          example: You are a concise travel assistant.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Moment of the last change or message.

    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
          description: Defaults to "Untitled conversation".
        model:
          type: string
          nullable: true
          description: One of the models the server allows. Defaults to the server's default model.
          example: gpt-4
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
          description: Defaults to the server's default temperature.
        system_prompt:
          type: string
          nullable: true
          maxLength: 4000

    ConversationReplace:
      type: object
      additionalProperties: false
      required: [title, model, temperature, system_prompt]
      properties:
        title:
          type: string
          maxLength: 255
        model:
          type: string
          example: gpt-4
        temperature:
          type: number
          minimum: 0
          maximum: 2
        system_prompt:
          type: string
          nullable: true
          maxLength: 4000

    ConversationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Conversation'

    ConversationList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TokenUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0

    Completion:
      type: object
      description: How the model produced an assistant message.
      required: [model, finish_reason, usage]
      properties:
        model:
          type: string
          example: gpt-4-0613
        finish_reason:
          type: string
          nullable: true
          example: stop
        usage:
          allOf:
            - $ref: '#/components/schemas/TokenUsage'
          nullable: true

    Message:
      type: object
      required: [id, conversation_id, role, content, completion, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        completion:
          allOf:
            - $ref: '#/components/schemas/Completion'
          nullable: true
          description: Only present on assistant messages.
        created_at:
          type: string
          format: date-time

    MessageCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          example: What should I see in Lisbon?

    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Message'

    MessageList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ExchangeResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user_message, assistant_message]
          properties:
            user_message:
              $ref: '#/components/schemas/Message'
            assistant_message:
              $ref: '#/components/schemas/Message'

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Conversation "0191c3a2-7d4b-7c3e-9f61-2b1c8e5d4a70" was not found.
        code:
          type: string
          description: Stable machine readable error identifier.
          example: conversation_not_found
        errors:
          type: object
          description: Validation messages keyed by field. Only on validation problems.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            temperature: [The temperature field must be between 0 and 2.]

  responses:
    BadRequest:
      description: The request body is not valid JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The conversation or message does not exist (or the URL matches no route).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request data is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded; see the Retry-After header.
      headers:
        Retry-After:
          description: Seconds until the next request is accepted.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: OpenAI rejected the request or returned an unusable answer. Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GatewayTimeout:
      description: OpenAI did not answer in time. Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
